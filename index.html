<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battery Intelligence — Interactive research tools</title><meta name="description" content="Explore battery cooling predictions and build thermal propagation layouts in one interactive research platform."><style>*{box-sizing:border-box}body{margin:0;background:#e4ebf0;color:#17364c;font:16px/1.6 Arial,"Microsoft YaHei",sans-serif}header{padding:18px 5%;background:#142d40;border-bottom:4px solid #188d9a;display:flex;align-items:center;justify-content:space-between;color:white}header a{font-size:23px;font-weight:bold;color:white;text-decoration:none}button{background:#294b61;border:1px solid #7896a9;border-radius:4px;padding:8px 16px;color:white;cursor:pointer;font:inherit}.intro{max-width:1180px;margin:65px auto 35px;padding:0 28px}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:2px;color:#287783;font-weight:700}h1{font-size:48px;letter-spacing:-1.5px;line-height:1.15;margin:16px 0}p{color:#526f83}.intro p{max-width:750px}.tools{max-width:1180px;margin:auto;padding:0 28px 65px;display:grid;grid-template-columns:1fr 1fr;gap:26px}.tool{display:flex;flex-direction:column;border:2px solid #8aa4b5;border-radius:10px;background:#f8fafb;overflow:hidden;box-shadow:0 6px 18px #243f5010;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s}.tool:hover{transform:translateY(-4px);border-color:#1a7c8f}.art{height:210px;background:#d5e3ec;border-bottom:1px solid #adc3d1;display:flex;align-items:center;justify-content:center}.art svg{width:90%;height:175px}.copy{padding:26px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:bold;color:#27798a}.copy h2{font-size:27px;margin:9px 0}.copy p{font-size:14px;min-height:68px}.go{display:inline-block;background:#1e536d;color:white;padding:9px 16px;border-radius:4px;font-weight:600;font-size:14px}.footer{border-top:1px solid #b0c3cf;padding:18px;text-align:center;font-size:12px;color:#668194}@media(max-width:650px){.intro{margin-top:32px}h1{font-size:34px}.tools{grid-template-columns:1fr}.copy p{min-height:0}header a{font-size:18px}}</style></head><body><header><a href="./">Battery Intelligence</a><button id="lang">中文</button></header><section class="intro"><span class="eyebrow" data-en="Interactive battery research" data-zh="交互式电池研究平台"></span><h1 data-en="Explore heat. Build understanding." data-zh="探索热行为，理解电池系统。"></h1><p data-en="From fast cooling predictions to hands-on pack design. Choose a workspace and explore how operating conditions, materials and layout shape thermal behaviour." data-zh="从快速冷却预测到自由搭建电池包，选择一个工作台，探索工况、材料和布局如何改变电池热行为。"></p></section><main class="tools"><a class="tool" href="./cooling/"><div class="art"><svg viewBox="0 0 420 180" aria-hidden="true"><defs><linearGradient id="heat"><stop stop-color="#eb8750"/><stop offset=".5" stop-color="#ecc96e"/><stop offset="1" stop-color="#42a8b8"/></linearGradient></defs><g stroke="#48869c" stroke-width="1" fill="none" opacity=".5"><path d="M20 60Q100 0 170 35T230 75M20 60Q95 90 170 80T230 75M20 125Q100 160 170 120T230 75M20 125Q100 30 170 35T230 75"/></g><g fill="#4592a1"><circle cx="20" cy="60" r="6"/><circle cx="20" cy="125" r="6"/><circle cx="170" cy="35" r="5"/><circle cx="170" cy="80" r="5"/><circle cx="170" cy="120" r="5"/></g><rect x="244" y="18" width="150" height="144" rx="5" fill="url(#heat)" stroke="#315c73" stroke-width="2"/><path d="M244 42H394M244 66H394M244 90H394M244 114H394M244 138H394M319 18V162" stroke="#fff" opacity=".45"/></svg></div><div class="copy"><span class="tag" data-en="Five inputs · POD + RBF" data-zh="五参数 · POD + RBF"></span><h2>Cooling Explorer</h2><p data-en="Adjust flow, coolant temperature, initial SOC, charging rate and ambient temperature. Predict upper and lower battery temperature fields instantly." data-zh="调整流量、冷却液温度、初始 SOC、充电倍率和环境温度，实时预测电池上下切面的温度分布。"></p><span class="go" data-en="Explore cooling →" data-zh="进入冷却预测 →"></span></div></a><a class="tool" href="./propagation/"><div class="art"><svg viewBox="0 0 420 180" aria-hidden="true"><defs><linearGradient id="metal"><stop stop-color="#7da1b6"/><stop offset=".5" stop-color="#d2e0e8"/><stop offset="1" stop-color="#8baabd"/></linearGradient></defs><g fill="url(#metal)" stroke="#375d74" stroke-width="2"><rect x="76" y="15" width="48" height="150" rx="4"/><rect x="145" y="15" width="48" height="150" rx="4"/><rect x="214" y="15" width="48" height="150" rx="4"/><rect x="283" y="15" width="48" height="150" rx="4"/></g><g fill="#c49e6f" stroke="#746044"><rect x="86" y="28" width="28" height="25" rx="3"/><rect x="155" y="28" width="28" height="25" rx="3"/><rect x="224" y="28" width="28" height="25" rx="3"/><rect x="293" y="28" width="28" height="25" rx="3"/></g><g fill="#97b3be" stroke="#506d80"><rect x="86" y="127" width="28" height="25" rx="3"/><rect x="155" y="127" width="28" height="25" rx="3"/><rect x="224" y="127" width="28" height="25" rx="3"/><rect x="293" y="127" width="28" height="25" rx="3"/></g><g fill="#8dc3ac" stroke="#4a8b76"><rect x="126" y="15" width="11" height="150"/><rect x="195" y="15" width="11" height="150"/><rect x="264" y="15" width="11" height="150"/></g><g fill="#bd9360"><rect x="138" y="15" width="5" height="150"/><rect x="207" y="15" width="5" height="150"/><rect x="276" y="15" width="5" height="150"/></g></svg></div><div class="copy"><span class="tag" data-en="Freeform layouts · Thermal resistance network" data-zh="自由布局 · 热阻网络"></span><h2>Propagation Studio</h2><p data-en="Assemble cells, PCM and thermal barriers. Choose a trigger cell and follow heat through your design with a transient thermal network." data-zh="自由组合电芯、PCM 与隔热层，选择触发电芯，通过瞬态热阻网络观察热量在布局中的传播。"></p><span class="go" data-en="Start building →" data-zh="开始搭建 →"></span></div></a></main><div class="footer">Battery Intelligence · <span data-en="Interactive research tools" data-zh="交互式研究工具"></span></div><script>let lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en';function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);document.getElementById('lang').textContent=lang==='en'?'中文':'EN';document.querySelectorAll('.tool').forEach(a=>{const u=new URL(a.href);u.searchParams.set('lang',lang);a.href=u.href;});}document.getElementById('lang').onclick=()=>{lang=lang==='en'?'zh':'en';render();};const q=new URLSearchParams(location.search);if(['flow','tin','soc','crate','ambient','modes'].some(k=>q.has(k)))location.replace('./cooling/'+location.search+location.hash);render();</script></body></html>
